
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colar em Camadas | Ana Pratas</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .pagina-colar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 50px;
            max-width: 1100px;
            margin: 60px auto;
            padding: 30px;
        }

        .pagina-colar img {
            width: 100%;
            max-width: 450px;
            max-height: 450px;
            object-fit: contain;
            border-radius: 15px;
        }

        .informacoes-colar {
            max-width: 450px;
        }

        .informacoes-colar h1 {
            color: #79515a;
            margin-bottom: 15px;
        }

        .preco-colar {
            color: #9b526b;
            font-size: 28px;
            font-weight: bold;
            margin: 20px 0;
        }

        .descricao-colar {
            color: #666;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .botao-voltar {
            display: inline-block;
            background: #a85f75;
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-weight: bold;
        }

        .botao-voltar:hover {
            background: #793d52;
        }

        @media (max-width: 700px) {
            .pagina-colar {
                flex-direction: column;
                gap: 20px;
                margin: 25px auto;
                padding: 20px;
            }

            .pagina-colar img {
                max-width: 100%;
                max-height: 350px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Ana Pratas</h1>
        <p>Brilhe do seu jeito</p>
    </header>

    <main class="pagina-colar">

        <img
            src="imagens/colar-camadas.jpg"
            alt="Colar em Camadas"
        >

        <div class="informacoes-colar">
            <h1>Colar em Camadas</h1>

            <p class="preco-colar">R$ 99,90</p>

            <p class="descricao-colar">
                Um colar delicado e elegante, perfeito para
                complementar seu visual com charme e sofisticação.
                Uma peça versátil para diferentes ocasiões.
            </p>

            <a href="index.html" class="botao-voltar">
                VOLTAR À LOJA
            </a>
        </div>

    </main>

</body>
</html>
